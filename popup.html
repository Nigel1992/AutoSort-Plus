<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>AutoSort+ Stats</title>
    <link rel="stylesheet" href="styles.css">
    <style>
        .popup-container {
            width: 300px;
            padding: 15px;
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
        }
        .stats-section {
            margin-bottom: 15px;
            padding: 10px;
            background: var(--background-color, #f8f9fa);
            border-radius: 4px;
            border: 1px solid var(--border-color, #dee2e6);
        }
        .stats-section h3 {
            margin-top: 0;
            margin-bottom: 10px;
            color: var(--text-color, #212529);
            font-size: 1.1em;
        }
        .stat-item {
            display: flex;
            justify-content: space-between;
            padding: 5px 0;
            border-bottom: 1px solid var(--border-color-light, #e9ecef);
        }
        .stat-item:last-child {
            border-bottom: none;
        }
        .stat-label {
            font-weight: 500;
        }
        .stat-value {
            font-weight: 600;
        }
        .stat-value.sorted { color: var(--success-color, #28a745); }
        .stat-value.skipped { color: var(--warning-color, #ffc107); }
        .stat-value.failed { color: var(--error-color, #dc3545); }
        .stat-value.api-key { color: var(--info-color, #007bff); }
        .button-group {
            display: flex;
            gap: 10px;
            margin-top: 15px;
        }
        .button {
            flex: 1;
            padding: 8px 12px;
            border: none;
            border-radius: 4px;
            cursor: pointer;
            font-size: 0.9em;
        }
        .button.primary {
            background: var(--primary-color, #007bff);
            color: white;
        }
        .button.secondary {
            background: var(--secondary-color, #6c757d);
            color: white;
        }
        .button:hover {
            opacity: 0.9;
        }
        .no-data {
            text-align: center;
            color: var(--text-muted, #6c757d);
            font-style: italic;
            padding: 20px;
        }
        .last-updated {
            font-size: 0.8em;
            color: var(--text-muted, #6c757d);
            text-align: center;
            margin-top: 10px;
        }
        .api-summary {
            text-align: center;
        }
        .api-summary-line {
            font-variant-numeric: tabular-nums;
            margin-bottom: 8px;
        }
        .api-summary-used {
            font-size: 1.9em;
            font-weight: 700;
            color: var(--text-color, #212529);
        }
        .api-summary-total {
            font-size: 1.1em;
            font-weight: 600;
            color: var(--text-muted, #6c757d);
        }
        .api-summary-suffix {
            font-size: 0.85em;
            color: var(--text-muted, #6c757d);
            margin-left: 4px;
        }
        .api-progress {
            height: 8px;
            background: var(--border-color-light, #e9ecef);
            border-radius: 4px;
            overflow: hidden;
            margin: 8px 0;
        }
        .api-progress-fill {
            height: 100%;
            width: 0;
            border-radius: 4px;
            background: var(--success-color, #28a745);
            transition: width 0.3s ease;
        }
        .api-progress-fill.warning { background: var(--warning-color, #ffc107); }
        .api-progress-fill.critical { background: var(--error-color, #dc3545); }
        .api-summary-detail {
            display: flex;
            justify-content: space-between;
            font-size: 0.8em;
            color: var(--text-muted, #6c757d);
        }
        .api-active-key {
            margin-top: 10px;
            font-size: 0.85em;
            color: var(--info-color, #007bff);
        }
    </style>
</head>
<body>
    <div class="popup-container">
        <div class="stats-section">
            <h3>📧 Email Sorting Stats</h3>
            <div class="stat-item">
                <span class="stat-label">Sorted Today:</span>
                <span class="stat-value sorted" id="sorted-today">0</span>
            </div>
            <div class="stat-item">
                <span class="stat-label">Skipped Today:</span>
                <span class="stat-value skipped" id="skipped-today">0</span>
            </div>
            <div class="stat-item">
                <span class="stat-label">Failed Today:</span>
                <span class="stat-value failed" id="failed-today">0</span>
            </div>
            <div class="stat-item">
                <span class="stat-label">Total Sorted:</span>
                <span class="stat-value sorted" id="sorted-total">0</span>
            </div>
        </div>

        <div class="stats-section">
            <h3>🔑 API Usage</h3>
            <div id="api-usage-display">
                <div class="no-data">Loading API usage...</div>
            </div>
        </div>

        <div class="button-group">
            <button class="button secondary" id="open-options">Settings</button>
            <button class="button primary" id="open-batch">Batch Panel</button>
        </div>

        <div class="last-updated" id="last-updated">Last updated: --</div>
    </div>

    <script src="popup.js"></script>
</body>
</html>
