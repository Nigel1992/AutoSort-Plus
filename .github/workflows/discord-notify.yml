name: Discord Notify

on:
  issues:
    types: [opened, closed, reopened]
  release:
    types: [published]
  push:
    branches: ['**']
    tags-ignore: ['**']
  workflow_dispatch:

permissions:
  contents: read
  issues: write

jobs:
  notify:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      DISCORD_WEBHOOK_SUPPORT: ${{ secrets.DISCORD_WEBHOOK_SUPPORT }}
      DISCORD_WEBHOOK_IDEAS: ${{ secrets.DISCORD_WEBHOOK_IDEAS }}
      DISCORD_WEBHOOK_NEWS: ${{ secrets.DISCORD_WEBHOOK_NEWS }}
      GITHUB_TOKEN: ${{ github.token }}
    steps:
      - name: Post event to Discord
        shell: python
        run: |
          import json, os, re, urllib.error, urllib.request

          MARKER = re.compile(r"<!-- discord-message: (support|ideas):(\d+) -->")

          def post(url, payload):
              req = urllib.request.Request(
                  url,
                  data=json.dumps(payload).encode(),
                  headers={
                      "Content-Type": "application/json",
                      "User-Agent": "NigelDiscordNotify/1.0 (+https://github.com/Nigel1992)",
                  },
                  method="POST",
              )
              with urllib.request.urlopen(req, timeout=30) as r:
                  return r.status

          def discord(url, payload, method="POST"):
              req = urllib.request.Request(
                  url,
                  data=json.dumps(payload).encode(),
                  headers={
                      "Content-Type": "application/json",
                      "User-Agent": "NigelDiscordNotify/1.0 (+https://github.com/Nigel1992)",
                  },
                  method=method,
              )
              with urllib.request.urlopen(req, timeout=30) as r:
                  body = r.read()
                  return json.loads(body) if body else {}

          def github(method, path, payload=None):
              req = urllib.request.Request(
                  "https://api.github.com" + path,
                  data=json.dumps(payload).encode() if payload is not None else None,
                  headers={
                      "Authorization": "Bearer " + os.environ["GITHUB_TOKEN"],
                      "Accept": "application/vnd.github+json",
                      "User-Agent": "NigelDiscordNotify/1.0 (+https://github.com/Nigel1992)",
                  },
                  method=method,
              )
              with urllib.request.urlopen(req, timeout=30) as r:
                  return json.loads(r.read() or b"null")

          def find_marker(repo, number):
              found = None
              page = 1
              while True:
                  comments = github("GET", f"/repos/{repo}/issues/{number}/comments?per_page=100&page={page}")
                  for c in comments:
                      m = MARKER.search(c.get("body") or "")
                      if m:
                          found = (m.group(1), m.group(2))
                  if len(comments) < 100:
                      return found
                  page += 1

          def field(name, value, inline=False):
              return {"name": name, "value": (value or "-")[:1000], "inline": inline}

          event = os.environ.get("GITHUB_EVENT_NAME")
          repo = os.environ["GITHUB_REPOSITORY"]
          with open(os.environ["GITHUB_EVENT_PATH"]) as f:
              data = json.load(f)

          if event == "issues":
              issue = data["issue"]
              action = data["action"]
              labels = [l["name"] for l in issue.get("labels", [])]
              label_text = " ".join(labels).lower()
              suggestions = "feature" in label_text or "enhancement" in label_text
              channel = "ideas" if suggestions else "support"
              color = {"opened": 0x3498DB, "closed": 0x57F287, "reopened": 0xE67E22}.get(action, 0x95A5A6)
              payload = {"embeds": [{
                  "title": f"[{action.upper()}] #{issue['number']} {issue['title']}"[:256],
                  "url": issue["html_url"],
                  "color": color,
                  "description": (issue.get("body") or "")[:1500],
                  "fields": [
                      field("Author", issue["user"]["login"], True),
                      field("Labels", ", ".join(labels) or "none", True),
                  ],
                  "footer": {"text": repo},
              }]}

              webhooks = {
                  "support": os.environ.get("DISCORD_WEBHOOK_SUPPORT"),
                  "ideas": os.environ.get("DISCORD_WEBHOOK_IDEAS"),
              }
              number = issue["number"]
              marker = None if action == "opened" else find_marker(repo, number)
              if marker and webhooks.get(marker[0]):
                  base = webhooks[marker[0]].split("?")[0]
                  try:
                      discord(f"{base}/messages/{marker[1]}?thread_id={marker[1]}", payload, "PATCH")
                      print("Edited Discord post", marker[1])
                      raise SystemExit(0)
                  except urllib.error.HTTPError as e:
                      print("Could not edit Discord post", marker[1], "-", e.code, e.read().decode(errors="replace")[:500])
              if action != "opened":
                  print("No Discord post to update for", action, "; skipping")
                  raise SystemExit(0)
              if not webhooks[channel]:
                  print("Discord webhook secret missing; skipping")
                  raise SystemExit(0)
              payload["thread_name"] = f"#{number} {issue['title']}"[:100]
              msg = discord(webhooks[channel].split("?")[0] + "?wait=true", payload)
              github("POST", f"/repos/{repo}/issues/{number}/comments", {
                  "body": f"<!-- discord-message: {channel}:{msg['id']} -->\nLinked to the Discord post.",
              })
              print("Posted Discord post", msg["id"])
              raise SystemExit(0)

          elif event == "release":
              rel = data["release"]
              url = os.environ["DISCORD_WEBHOOK_NEWS"]
              payload = {"embeds": [{
                  "title": f"Release {rel['tag_name']}",
                  "url": rel["html_url"],
                  "color": 0x9B59B6,
                  "description": (rel.get("body") or "")[:1500],
                  "footer": {"text": repo},
              }]}

          elif event == "push":
              commits = data.get("commits", [])
              branch = data.get("ref", "").replace("refs/heads/", "")
              pusher = data.get("pusher", {}).get("name", "unknown")
              lines = []
              for c in commits[:10]:
                  msg = c.get("message", "").splitlines()[0][:100]
                  lines.append(f"`{c['id'][:7]}` {msg} — {c.get('author', {}).get('name', '?')}")
              if len(commits) > 10:
                  lines.append(f"…and {len(commits) - 10} more")
              url = os.environ["DISCORD_WEBHOOK_NEWS"]
              payload = {"embeds": [{
                  "title": f"{len(commits)} new commit(s) to {branch}",
                  "url": data.get("compare", ""),
                  "color": 0x2ECC71,
                  "description": "\n".join(lines)[:1500] or "(no commit details)",
                  "fields": [field("Pushed by", pusher, True)],
                  "footer": {"text": repo},
              }]}

          else:
              print("No Discord mapping for event:", event)
              raise SystemExit(0)

          if not url:
              print("Discord webhook secret missing; skipping")
              raise SystemExit(0)
          print("Discord response:", post(url, payload))
