name: Discord Notify

on:
  issues:
    types: [opened, closed, reopened]
  release:
    types: [published]
  push:
    branches: ['**']
    tags-ignore: ['**']
  workflow_dispatch:

permissions:
  contents: read
  issues: read

jobs:
  notify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      DISCORD_WEBHOOK_SUPPORT: ${{ secrets.DISCORD_WEBHOOK_SUPPORT }}
      DISCORD_WEBHOOK_IDEAS: ${{ secrets.DISCORD_WEBHOOK_IDEAS }}
      DISCORD_WEBHOOK_NEWS: ${{ secrets.DISCORD_WEBHOOK_NEWS }}
      DISCORD_BOT_TOKEN: ${{ secrets.DISCORD_BOT_TOKEN }}
      DISCORD_GUILD_ID: '1468295714961494029'
      DISCORD_FORUM_IDS: '{"support":"1570943779563765760","ideas":"1570943784685019218"}'
      DISCORD_TAG_IDS: '{"support":{"🐛 Bug":"1570943779563765761","❓ Question":"1570943779563765762","✅ Resolved":"1570943779563765763"},"ideas":{"💡 Idea":"1570943784685019219","🛠 Planned":"1570943784685019220","✔ Done":"1570943784685019221","❌ Rejected":"1570943784685019222"}}'
    steps:
      - name: Post event to Discord
        shell: python
        run: |
          import json, os, urllib.request

          GUILD = os.environ["DISCORD_GUILD_ID"]
          FORUMS = json.loads(os.environ["DISCORD_FORUM_IDS"])
          TAG_IDS = json.loads(os.environ["DISCORD_TAG_IDS"])
          WEBHOOKS = {"support": "DISCORD_WEBHOOK_SUPPORT", "ideas": "DISCORD_WEBHOOK_IDEAS"}
          UA = "NigelDiscordNotify/1.0 (+https://github.com/Nigel1992)"

          def http(method, url, payload=None, headers=None):
              h = {"Content-Type": "application/json", "User-Agent": UA}
              h.update(headers or {})
              req = urllib.request.Request(
                  url,
                  data=json.dumps(payload).encode() if payload is not None else None,
                  headers=h,
                  method=method,
              )
              with urllib.request.urlopen(req, timeout=30) as r:
                  body = r.read()
                  return json.loads(body) if body else {}

          def bot(method, path, payload=None):
              return http(method, "https://discord.com/api/v10" + path, payload, {"Authorization": "Bot " + os.environ["DISCORD_BOT_TOKEN"]})

          def field(name, value, inline=False):
              return {"name": name, "value": (value or "-")[:1000], "inline": inline}

          def tag_id(kind, word):
              return next((v for k, v in TAG_IDS[kind].items() if k.split(" ", 1)[-1] == word), None)

          def tags_for(kind, labels, state):
              l = [x.lower() for x in labels]
              has = lambda *ks: any(k in x for x in l for k in ks)
              words = []
              if kind == "support":
                  if has("bug"):
                      words.append("Bug")
                  elif has("question"):
                      words.append("Question")
                  if state == "closed":
                      words.append("Resolved")
              else:
                  words.append("Idea")
                  if state == "closed":
                      words.append("Rejected" if has("wontfix", "invalid", "duplicate", "not planned") else "Done")
                  elif has("progress", "planned"):
                      words.append("Planned")
              return [t for t in (tag_id(kind, w) for w in words) if t]

          def find_thread(kind, number):
              prefix = f"#{number} "
              forum = FORUMS[kind]
              for t in bot("GET", f"/guilds/{GUILD}/threads/active").get("threads", []):
                  if t["parent_id"] == forum and t["name"].startswith(prefix):
                      return t
              before = None
              for _ in range(20):
                  path = f"/channels/{forum}/threads/archived/public?limit=100" + (f"&before={before}" if before else "")
                  data = bot("GET", path)
                  for t in data.get("threads", []):
                      if t["name"].startswith(prefix):
                          return t
                  if not data.get("has_more") or not data.get("threads"):
                      return None
                  before = data["threads"][-1]["thread_metadata"]["archive_timestamp"]
              return None

          def sync(thread, kind, labels, state, payload):
              tid = thread["id"]
              archived = thread.get("thread_metadata", {}).get("archived", False)
              if archived:
                  bot("PATCH", f"/channels/{tid}", {"archived": False})
              try:
                  bot("PATCH", f"/channels/{tid}", {"applied_tags": tags_for(kind, labels, state)})
                  webhook = os.environ[WEBHOOKS[kind]].split("?")[0]
                  http("PATCH", f"{webhook}/messages/{tid}?thread_id={tid}", payload)
              finally:
                  if archived:
                      bot("PATCH", f"/channels/{tid}", {"archived": True})

          event = os.environ.get("GITHUB_EVENT_NAME")
          repo = os.environ["GITHUB_REPOSITORY"]
          with open(os.environ["GITHUB_EVENT_PATH"]) as f:
              data = json.load(f)

          if event == "issues":
              issue = data["issue"]
              action = data["action"]
              number = issue["number"]
              labels = [l["name"] for l in issue.get("labels", [])]
              label_text = " ".join(labels).lower()
              suggestions = "feature" in label_text or "enhancement" in label_text
              kind = "ideas" if suggestions else "support"
              color = {"opened": 0x3498DB, "closed": 0x57F287, "reopened": 0xE67E22}.get(action, 0x95A5A6)
              payload = {"embeds": [{
                  "title": f"[{action.upper()}] #{number} {issue['title']}"[:256],
                  "url": issue["html_url"],
                  "color": color,
                  "description": (issue.get("body") or "")[:1500],
                  "fields": [
                      field("Author", issue["user"]["login"], True),
                      field("Labels", ", ".join(labels) or "none", True),
                  ],
                  "footer": {"text": repo},
              }]}

              if action == "opened":
                  if not os.environ.get(WEBHOOKS[kind]):
                      print("Discord webhook secret missing; skipping")
                      raise SystemExit(0)
                  payload["thread_name"] = f"#{number} {issue['title']}"[:100]
                  payload["applied_tags"] = tags_for(kind, labels, "open")
                  url = os.environ[WEBHOOKS[kind]].split("?")[0] + "?wait=true"
                  msg = http("POST", url, payload)
                  print("Posted Discord post", msg["id"])
                  raise SystemExit(0)

              other = "ideas" if kind == "support" else "support"
              found = None
              for k in (kind, other):
                  found = find_thread(k, number)
                  if found:
                      kind = k
                      break
              if not found:
                  print("No Discord post found for #", number, "; skipping")
                  raise SystemExit(0)
              sync(found, kind, labels, issue["state"], payload)
              print("Updated Discord post", found["id"], "for", action)
              raise SystemExit(0)

          elif event == "release":
              rel = data["release"]
              url = os.environ["DISCORD_WEBHOOK_NEWS"]
              payload = {"embeds": [{
                  "title": f"Release {rel['tag_name']}",
                  "url": rel["html_url"],
                  "color": 0x9B59B6,
                  "description": (rel.get("body") or "")[:1500],
                  "footer": {"text": repo},
              }]}

          elif event == "push":
              commits = data.get("commits", [])
              branch = data.get("ref", "").replace("refs/heads/", "")
              pusher = data.get("pusher", {}).get("name", "unknown")
              lines = []
              for c in commits[:10]:
                  msg = c.get("message", "").splitlines()[0][:100]
                  lines.append(f"`{c['id'][:7]}` {msg} — {c.get('author', {}).get('name', '?')}")
              if len(commits) > 10:
                  lines.append(f"…and {len(commits) - 10} more")
              url = os.environ["DISCORD_WEBHOOK_NEWS"]
              payload = {"embeds": [{
                  "title": f"{len(commits)} new commit(s) to {branch}",
                  "url": data.get("compare", ""),
                  "color": 0x2ECC71,
                  "description": "\n".join(lines)[:1500] or "(no commit details)",
                  "fields": [field("Pushed by", pusher, True)],
                  "footer": {"text": repo},
              }]}

          else:
              print("No Discord mapping for event:", event)
              raise SystemExit(0)

          if not url:
              print("Discord webhook secret missing; skipping")
              raise SystemExit(0)
          print("Discord response:", http("POST", url, payload))
